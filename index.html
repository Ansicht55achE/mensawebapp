<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mensa Vorbestellsystem</title>
<style>
:root {
--primary-color: #0056b3;
--secondary-color: #f8f9fa;
--text-color: #333;
--border-color: #ccc;
}
body {
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
color: var(--text-color);
margin: 0;
padding: 20px;
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;

background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('MensaFoto.jpg');
background-size: cover;
background-position: center;
background-repeat: no-repeat;
background-attachment: fixed;
}
.container {
background: rgba(255, 255, 255, 0.94);
backdrop-filter: blur(8px);
padding: 30px;
border-radius: 12px;
box-shadow: 0 8px 25px rgba(0,0,0,0.3);
max-width: 500px;
width: 100%;
}
h1 {
text-align: center;
color: var(--primary-color);
margin-bottom: 20px;
}
.form-group {
margin-bottom: 15px;
}
label {
display: block;
margin-bottom: 5px;
font-weight: bold;
}
input, select {
width: 100%;
padding: 10px;
border: 1px solid var(--border-color);
border-radius: 4px;
box-sizing: border-box;
background-color: #fff;
}
button {
width: 100%;
padding: 12px;
background-color: var(--primary-color);
color: white;
border: none;
border-radius: 4px;
font-size: 16px;
font-weight: bold;
cursor: pointer;
transition: background 0.2s;
}
button:hover {
background-color: #004085;
}
.message {
margin-top: 15px;
padding: 10px;
border-radius: 4px;
text-align: center;
display: none;
}
.success {
background-color: #d4edda;
color: #155724;
border: 1px solid #c3e6cb;
}
.error {
background-color: #f8d7da;
color: #721c24;
border: 1px solid #f5c6cb;
}
</style>
</head>
<body>

<div class="container">
<h1>Mensa Essensvorbestellung</h1>
<form id="orderForm" action="https://script.google.com/macros/s/AKfycbxHQ8enrp95kFxLPi10_vkco_CbZQOYPZssPek9awWPPLiREfUBsZ6IaL9vh6g6FWrvHw/exec" method="POST">

<div class="form-group">
<label for="name">Name, Vorname:</label>
<input type="text" id="name" name="name" required placeholder="Max Mustermann" pattern="^[a-zA-ZäöüÄÖÜß\s\-]+$" title="Bitte nur Buchstaben eingeben, keine Zahlen oder Sonderzeichen.">
</div>

<div class="form-group">
<label for="datum">Datum der Vorbestellung:</label>
<input type="date" id="datum" name="datum" required>
</div>

<div class="form-group">
<label for="gericht">Gericht auswählen:</label>
<select id="gericht" name="gericht" required>
<option value="" disabled selected>Bitte erst Datum wählen...</option>
</select>
</div>

<div class="form-group">
<label for="beilage">Beilage auswählen:</label>
<select id="beilage" name="beilage" required>
<option value="" disabled selected>Bitte wählen...</option>
<option value="Keine Beilage">Keine Beilage</option>
<option value="Pommes Frites">Pommes Frites</option>
<option value="Beilagensalat">Beilagensalat</option>
<option value="Tagessuppe">Tagessuppe</option>
<option value="Dessert des Tages">Dessert des Tages</option>
</select>
</div>

<div class="form-group">
<label for="anzahl">Anzahl:</label>
<input type="number" id="anzahl" name="anzahl" min="1" max="5" value="1" required>
</div>

<div class="form-group">
<label for="uhrzeit">Uhrzeit der Vorbestellung:</label>
<select id="uhrzeit" name="uhrzeit" required>
<option value="" disabled selected>Bitte wählen...</option>
<option value="11:30">11:30 Uhr</option>
<option value="11:45">11:45 Uhr</option>
<option value="12:00">12:00 Uhr</option>
<option value="12:15">12:15 Uhr</option>
<option value="12:30">12:30 Uhr</option>
<option value="12:45">12:45 Uhr</option>
<option value="13:00">13:00 Uhr</option>
<option value="13:15">13:15 Uhr</option>
<option value="13:30">13:30 Uhr</option>
<option value="13:45">13:45 Uhr</option>
<option value="14:00">14:00 Uhr</option>
</select>
</div>

<button type="submit">Jetzt verbindlich vorbestellen</button>
</form>

<div id="responseMessage" class="message"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
const form = document.getElementById('orderForm');
const responseMessage = document.getElementById('responseMessage');
const datumInput = document.getElementById('datum');
const gerichtSelect = document.getElementById('gericht');

function formatLocalDate(dateObj) {
const year = dateObj.getFullYear();
const month = String(dateObj.getMonth() + 1).padStart(2, '0');
const day = String(dateObj.getDate()).padStart(2, '0');
return `${year}-${month}-${day}`;
}

function getNextWeekday(dateObj) {
const d = new Date(dateObj);
const day = d.getDay();
if (day === 6) {
d.setDate(d.getDate() + 2);
} else if (day === 0) {
d.setDate(d.getDate() + 1);
}
return d;
}

const today = new Date();
const firstAvailableDate = getNextWeekday(today);

const minDateStr = formatLocalDate(today);
const defaultDateStr = formatLocalDate(firstAvailableDate);

const maxDate = new Date();
maxDate.setMonth(maxDate.getMonth() + 2);
const maxDateStr = formatLocalDate(maxDate);

datumInput.min = minDateStr;
datumInput.max = maxDateStr;
datumInput.value = defaultDateStr;

const menusByDay = {
1: [
"Menü 1: Spaghetti Bolognese (auch vegan)",
"Menü 2: Kichererbsen-Curry mit Reis (vegan)",
"Menü 3: Großer Salatteller mit Putenstreifen"
],
2: [
"Menü 1: Schnitzel mit Pommes und Jägersoße",
"Menü 2: Falafel-Wrap mit Knoblauchsoße (vegan)",
"Menü 3: Caesar Salad mit Croutons"
],
3: [
"Menü 1: Hähnchen-Curry mit Gemüse",
"Menü 2: Gemüselasagne",
"Menü 3: Griechischer Bauernsalat"
],
4: [
"Menü 1: Burger mit Wedges",
"Menü 2: Veganes Chili sin Carne",
"Menü 3: Nudelsalat mit getrockneten Tomaten"
],
5: [
"Menü 1: Backfisch mit Kartoffelsalat",
"Menü 2: Spinat-Ricotta-Tortellini",
"Menü 3: Fitness-Salat mit Avocado"
]
};

function updateMenusForDate(dateString) {
if (!dateString) return;

const [year, month, day] = dateString.split('-').map(Number);
const selectedDate = new Date(year, month - 1, day);
const dayOfWeek = selectedDate.getDay();

gerichtSelect.innerHTML = '<option value="" disabled selected>Bitte wählen...</option>';

if (dayOfWeek === 0 || dayOfWeek === 6) {
alert("Am Wochenende hat the Mensa geschlossen. Bitte wähle einen Wochentag (Montag bis Freitag).");
datumInput.value = defaultDateStr;
updateMenusForDate(defaultDateStr);
return;
}

const availableMenus = menusByDay[dayOfWeek];
if (availableMenus) {
availableMenus.forEach(menu => {
const opt = document.createElement('option');
opt.value = menu;
opt.textContent = menu;
gerichtSelect.appendChild(opt);
});
}
}

updateMenusForDate(defaultDateStr);

datumInput.addEventListener('change', function() {
updateMenusForDate(this.value);
});

const profanityList = ["arsch", "hurensohn", "schlampe", "fotze", "wichser", "scheiße", "scheisse", "idiot", "dummer", "kanacke", "nazi", "penis", "arschloch"];

form.addEventListener('submit', function(e) {
e.preventDefault();

const nameValue = document.getElementById('name').value;
const nameLower = nameValue.toLowerCase();

if (/\d/.test(nameValue)) {
responseMessage.style.display = 'block';
responseMessage.className = 'message error';
responseMessage.textContent = 'Fehler: Der Name darf keine Zahlen enthalten!';
return;
}

const containsProfanity = profanityList.some(word => nameLower.includes(word));
if (containsProfanity) {
responseMessage.style.display = 'block';
responseMessage.className = 'message error';
responseMessage.textContent = 'Fehler: Der Name enthält unzulässige Begriffe. Bitte gib einen gültigen Namen ein.';
return;
}

responseMessage.style.display = 'block';
responseMessage.className = 'message success';
responseMessage.textContent = 'Bestellung wird übermittelt...';

const formData = new FormData(form);
fetch(form.action, {
method: 'POST',
body: formData
})
.then(response => response.json())
.then(data => {
if(data.result === 'success') {
responseMessage.className = 'message success';
responseMessage.textContent = 'Vielen Dank! Deine Bestellung wurde erfolgreich gespeichert.';
form.reset();
datumInput.value = defaultDateStr;
updateMenusForDate(defaultDateStr);
} else {
responseMessage.className = 'message error';
responseMessage.textContent = 'Fehler beim Speichern: ' + data.error;
}
})
.catch(error => {
responseMessage.className = 'message success';
responseMessage.textContent = 'Bestellung abgesendet! Bitte prüfe dein Postfach oder die Liste.';
form.reset();
datumInput.value = defaultDateStr;
updateMenusForDate(defaultDateStr);
});
});
});
</script>
</body>
</html>
